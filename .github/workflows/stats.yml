name: Generate Stats

on:

  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:


permissions:

  contents: write


jobs:

  stats:

    runs-on: ubuntu-latest


    steps:

      - uses: cicirello/user-statistician@v1

        with:

          username: DumiJDev

          output: github-stats.svg


      - uses: stefanzweifel/git-auto-commit-action@v5

        with:

          commit_message: "chore: update github stats"
